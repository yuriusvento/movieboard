<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171512" />
    <meta name="description" content="Интерактивная сценовая доска фильма «Линия огня»" />
    <title>Movieboard — Линия огня</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">MOVIEBOARD · КАНОНИЧЕСКАЯ РЕДАКЦИЯ</p>
        <div class="title-row">
          <h1>Линия огня</h1>
          <span class="version-pill">Версия 6</span>
        </div>
        <p class="subtitle">Сценовая доска · первый проход без изменений</p>
      </div>

      <div class="toolbar" aria-label="Инструменты доски">
        <label class="search-wrap">
          <span class="sr-only">Поиск по сценам</span>
          <input id="searchInput" type="search" placeholder="Найти сцену…" autocomplete="off" />
        </label>
        <button class="button button-primary" id="addSceneButton" type="button">+ Новая сцена</button>
        <div class="history-buttons" aria-label="История изменений">
          <button class="icon-button" id="undoButton" type="button" aria-label="Отменить изменение" title="Отменить" disabled>↶</button>
          <button class="icon-button" id="redoButton" type="button" aria-label="Повторить изменение" title="Повторить" disabled>↷</button>
        </div>
        <button class="button button-quiet" id="viewButton" type="button" aria-pressed="false">Компактно</button>
        <details class="file-menu">
          <summary class="button button-quiet">Файл</summary>
          <div class="file-menu-popover">
            <button id="exportJsonButton" type="button">Скачать доску</button>
            <button id="exportTextButton" type="button">Экспорт в текст</button>
            <button id="importButton" type="button">Загрузить доску</button>
            <div class="menu-divider"></div>
            <button class="danger-text" id="resetButton" type="button">Вернуть версию 6</button>
          </div>
        </details>
        <input id="importInput" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="workspace">
      <section class="board-meta" aria-label="Состояние доски">
        <p><span id="sceneCount">22</span> сцены <span class="drag-hint">· тяните карточку за точки</span></p>
        <p class="save-state" id="saveState"><span class="save-dot" aria-hidden="true"></span> <span id="saveStateText">Сохранено на этом устройстве</span></p>
      </section>

      <section class="board" id="board" aria-label="Сцены фильма"></section>
      <p class="empty-state" id="emptyState" hidden>По этому запросу сцен не найдено.</p>
    </main>

    <template id="sceneTemplate">
      <article class="scene-card">
        <details class="scene-details">
          <summary class="scene-summary">
            <span class="drag-handle" role="button" tabindex="0" aria-label="Перетащить сцену" title="Перетащить">⠿</span>
            <span class="scene-index"></span>
            <span class="scene-heading">
              <span class="scene-title"></span>
              <span class="scene-location"></span>
            </span>
            <span class="chevron" aria-hidden="true"></span>
          </summary>
          <div class="scene-body">
            <div class="scene-copy"></div>
            <form class="scene-editor" autocomplete="off">
              <label>
                <span>Название</span>
                <input class="edit-title" type="text" />
              </label>
              <label>
                <span>Место и время</span>
                <input class="edit-location" type="text" />
              </label>
              <label>
                <span>Содержание</span>
                <textarea class="edit-body" rows="7"></textarea>
              </label>
              <label>
                <span>Рабочие заметки</span>
                <textarea class="edit-notes" rows="3" placeholder="Монтаж, драматургия, визуальные решения…"></textarea>
              </label>
              <fieldset class="color-fieldset">
                <legend>Цвет линии</legend>
                <div class="color-swatches"></div>
              </fieldset>
              <div class="card-actions">
                <button class="small-button add-after-button" type="button">+ После</button>
                <button class="small-button duplicate-button" type="button">Дублировать</button>
                <button class="small-button delete-button" type="button">Удалить</button>
              </div>
            </form>
          </div>
        </details>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
